# =============================================================================
# Build AUR Repository — daily cron + manual trigger (orchestrator)
#
# 编排器：调度（schedule/push/manual/webhook）→ prepare → build（matrix）→
# publish（调 publish-repo.yaml）→ deploy-s3（调 deploy-s3.yaml，可选）
#
# 子工作流（各自可独立复用/手动触发）：
#   .github/workflows/build-package.yaml   # 单包构建（matrix 调用）
#   .github/workflows/publish-repo.yaml    # 收集 artifacts + repo-add + 上传 latest
#   .github/workflows/deploy-s3.yaml       # latest → S3 同步
#   .github/workflows/manual-publish.yaml  # 手动重发布（从历史构建 run）
#   .github/workflows/manual-deploy-s3.yaml# 手动 S3 同步
# =============================================================================

name: Build AUR Repository

# The repository orchestrator serializes all complete build/publish runs.
# Never cancel one in progress: it could already be uploading to latest.
# Pending runs collapse to the newest workflow event on bursty pushes.
concurrency:
  group: arch-lib-build-repository
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: '只更新指定包，逗号/空格分隔；留空则运行完整构建'
        required: false
        type: string
        default: ''
  # Optional signed upstream webhook relay; payload never controls checkout.
  repository_dispatch:
    types: [openuuyc-update]
  push:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  # ── Prepare: parse package list + split 包去重 ────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      targeted: ${{ steps.gen-matrix.outputs.targeted }}
      claude_selected: ${{ steps.gen-matrix.outputs.claude_selected }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix from packages.txt
        id: gen-matrix
        env:
          REQUESTED_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.packages || '' }}
        run: |
          mapfile -t pkgs < <(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' packages.txt | grep -v '^$')

          # A non-empty manual selection is intentionally a partial publication.
          # Resolve package names against packages.txt before any build can start.
          targeted=0
          claude_selected=0
          declare -A requested_pkg=()
          declare -A package_exists=()
          for pkg in "${pkgs[@]}"; do package_exists["$pkg"]=1; done
          selected_input="${REQUESTED_PACKAGES//$'\r'/ }"
          selected_input="${selected_input//$'\n'/ }"
          selected_input="${selected_input//$'\t'/ }"
          selected_input="${selected_input//,/ }"
          if [[ -n "$REQUESTED_PACKAGES" && -z "${selected_input//[[:space:]]/}" ]]; then
            echo "::error::Package selection contains no package names" >&2
            exit 1
          fi
          if [[ -n "${selected_input//[[:space:]]/}" ]]; then
            read -r -a requested <<< "$selected_input"
            for pkg in "${requested[@]}"; do
              [ -n "$pkg" ] || continue
              if [[ -z "${package_exists[$pkg]:-}" ]]; then
                echo "::error::Unknown package '$pkg' (not present in packages.txt)" >&2
                exit 1
              fi
              requested_pkg["$pkg"]=1
            done
            if [[ ${#requested_pkg[@]} -eq 0 ]]; then
              echo "::error::No package names supplied in selection" >&2
              exit 1
            fi
            claude_http=${requested_pkg["claude-desktop-http-patch"]:-0}
            claude_full=${requested_pkg["claude-desktop-full-patch"]:-0}
            if [ "$claude_http" = 1 ] || [ "$claude_full" = 1 ]; then
              claude_selected=1
            fi
            if { [ "$claude_http" = 1 ] || [ "$claude_full" = 1 ]; } && \
               { [ "$claude_http" != 1 ] || [ "$claude_full" != 1 ]; }; then
              echo "::error::Select both Claude desktop patch packages together, or select neither" >&2
              exit 1
            fi
            targeted=1
            echo "Targeted package update: ${!requested_pkg[*]}"
          fi

          # 解析 AUR PackageBase：split 包（rustrover / rustrover-jre）共享
          # 同一 PKGBUILD，一次 makepkg 产出全部子包。矩阵只保留每个 base
          # 在 packages.txt 中的第一个包名，同族版本/资产元数据由构建
          # （或复用）job 一并产出，避免重复下载 ~1GB 源码 + 重复构建。
          declare -A base_of=()
          : > /tmp/aur-bases.txt
          for ((i=0; i<${#pkgs[@]}; i+=40)); do
            args=()
            for pkg in "${pkgs[@]:i:40}"; do
              args+=(--data-urlencode "arg[]=$pkg")
            done
            curl -G -fsSL --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
              "${args[@]}" "https://aur.archlinux.org/rpc/v5/info" 2>/dev/null \
              | jq -r '.results[]? | "\(.Name)\t\(.PackageBase)"' 2>/dev/null || true
          done >> /tmp/aur-bases.txt
          while IFS=$'\t' read -r name base; do
            [ -n "$name" ] && base_of["$name"]="$base"
          done < /tmp/aur-bases.txt

          declare -A selected_base=()
          declare -A selected_custom=()
          if [ "$targeted" -eq 1 ]; then
            for pkg in "${!requested_pkg[@]}"; do
              if [ -f "custom-pkgs/$pkg/PKGBUILD" ]; then
                selected_custom["$pkg"]=1
              else
                if [ -z "${base_of[$pkg]:-}" ]; then
                  echo "::error::Cannot resolve selected AUR PackageBase for '$pkg'; refusing an ambiguous partial update" >&2
                  exit 1
                fi
                selected_base["${base_of[$pkg]}"]=1
              fi
            done
          fi

          declare -A seen_base=()
          kept=()
          for pkg in "${pkgs[@]}"; do
            # 自定义配方优先于 AUR，不参与 AUR PackageBase 去重
            if [ -f "custom-pkgs/$pkg/PKGBUILD" ]; then
              if [ "$targeted" -eq 1 ] && [ -z "${selected_custom[$pkg]:-}" ]; then
                continue
              fi
              kept+=("$pkg")
              continue
            fi
            base="${base_of[$pkg]:-$pkg}"
            if [ "$targeted" -eq 1 ] && [ -z "${selected_base[$base]:-}" ]; then
              continue
            fi
            if [ -n "${seen_base[$base]:-}" ]; then
              echo "  dedup: $pkg (same PackageBase $base — covered by sibling)"
              continue
            fi
            seen_base["$base"]=1
            kept+=("$pkg")
          done

          echo "targeted=$([ "$targeted" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "claude_selected=$([ "$claude_selected" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ "${#kept[@]}" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${kept[@]}" | jq -R . | jq -s -c . > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Packages: ${#kept[@]} (dedup'd from ${#pkgs[@]})"

  # ── Build: one job per package (reusable workflow) ─────────────────
  build:
    needs: prepare
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    uses: ./.github/workflows/build-package.yaml
    with:
      package: ${{ matrix.pkg }}

  # ── Publish: collect packages, build repo db, upload latest ────────
  publish:
    needs: [prepare, build]
    # 单个 build 失败不应阻塞整个仓库发布：prepare 成功后即发布已成功的包。
    # always() 必须显式保留对失败 needs 的执行资格；fail-fast=false 让其余矩阵项继续。
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/publish-repo.yaml
    with:
      # Manual selections deliberately update only the selected package bases.
      # Restore the existing signed database and preserve all untouched assets.
      partial-update: ${{ needs.prepare.outputs.targeted == 'true' || needs.build.result != 'success' }}
      # The existing Claude entries stay in the restored database during an
      # explicitly selected successful update; never bypass this gate on failure.
      allow-missing-required-claude: ${{ needs.prepare.outputs.targeted == 'true' && needs.prepare.outputs.claude_selected != 'true' && needs.build.result == 'success' }}
    secrets: inherit

  # ── Deploy to S3（可选，配置 S3_* secrets 后自动启用）──────────────
  # secrets 不能用于 job if（GitHub 限制），S3 配置检查在 deploy-s3.yaml
  # 内部 guard step 完成（未配置则跳过所有步骤）。
  deploy-s3:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-s3.yaml
    secrets: inherit
