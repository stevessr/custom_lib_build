# =============================================================================
# Build AUR Repository — daily cron + manual trigger
#
# Strategy:
#   1. prepare  — read packages.txt, fetch last-versions.txt from latest Release
#   2. build    — matrix: one job per package, skip -git if commit hash unchanged
#   3. publish  — collect artifacts, repo-add, create GitHub Release with repo tarball
#
# User adds to /etc/pacman.conf:
#   [arch_lib]
#   SigLevel = Optional TrustAll
#   Server = https://github.com/<user>/arch_lib/releases/download/latest/$arch
# =============================================================================

name: Build AUR Repository

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Prepare: parse package list, download last-versions.txt ─────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix from packages.txt
        id: gen-matrix
        run: |
          # Read packages, strip comments/blanks
          packages=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' packages.txt | grep -v '^$' | jq -R . | jq -s -c .)
          echo "matrix=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

      - name: Download last-versions.txt from latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "last-versions.txt" \
            --dir . --clobber 2>/dev/null || true
          touch last-versions.txt

      - name: Upload last-versions.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-versions
          path: ./last-versions.txt
          if-no-files-found: ignore

  # ── Build: one job per package (matrix) ─────────────────────────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Arch system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git libglvnd pacman-contrib sudo

      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.cache/aur-sources /tmp/aur-build
          chown -R builder:builder /home/builder /tmp/aur-build

      - name: Download last-versions artifact
        uses: actions/download-artifact@v4
        with:
          name: last-versions
          path: ./last-versions
        continue-on-error: true

      - name: Prepare last-versions file
        run: |
          if [ -f ./last-versions/last-versions.txt ]; then
            mv ./last-versions/last-versions.txt ./last-versions.txt
          else
            touch ./last-versions.txt
          fi

      - name: Cache AUR sources
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/aur-sources
          key: aur-sources-${{ matrix.pkg }}-${{ github.run_id }}
          restore-keys: |
            aur-sources-${{ matrix.pkg }}-

      - name: Build package ${{ matrix.pkg }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # -E: keep env (SRCDEST, GITHUB_WORKSPACE), -H: set HOME=/home/builder
          #   (root's HOME=/github/home is not writable by builder — breaks
          #    Go/Rust build caches)
          sudo -EHu builder bash scripts/build-package.sh \
            "${{ matrix.pkg }}" "$GITHUB_WORKSPACE/output-${{ matrix.pkg }}.env"

      - name: Collect built package
        run: |
          mkdir -p artifact
          # Copy any .pkg.tar.* from the repo dir
          cp -v repos/x86_64/*.pkg.tar.* artifact/ 2>/dev/null || true
          # Read version/skip info written by build-package.sh
          outfile="$GITHUB_WORKSPACE/output-${{ matrix.pkg }}.env"
          if [ -f "$outfile" ]; then
            source "$outfile"
            echo "${{ matrix.pkg }}=${version:-unknown}" > artifact/versions.txt
          else
            echo "${{ matrix.pkg }}=unknown" > artifact/versions.txt
          fi
          echo "Package output:"; cat artifact/versions.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg }}
          path: artifact/
          if-no-files-found: warn

  # ── Publish: collect all artifacts, repo-add, create Release ────────
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result == 'success'
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Arch system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel gnupg pacman-contrib

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            # Extract fingerprint of the imported secret key
            FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            echo "KEY_ID=$FPR" >> "$GITHUB_ENV"
            echo "Signing key imported: $FPR"
          else
            echo "No GPG_PRIVATE_KEY secret — repository will be unsigned"
          fi

      - name: Download last-versions artifact
        uses: actions/download-artifact@v4
        with:
          name: last-versions
          path: ./last-versions
        continue-on-error: true

      - name: Prepare last-versions file
        run: |
          if [ -f ./last-versions/last-versions.txt ]; then
            mv ./last-versions/last-versions.txt ./last-versions.txt
          else
            touch ./last-versions.txt
          fi

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: ./packages-artifact

      - name: Merge versions and packages
        run: |
          mkdir -p repos/x86_64

          # Merge version files from each matrix job
          : > build-versions.txt
          for d in packages-artifact/pkg-*; do
            [ -d "$d" ] || continue
            # Copy .pkg.tar.* to repo dir (sanitize epoch colons)
            for f in "$d"/*.pkg.tar.*; do
              [ -f "$f" ] || continue
              base=$(basename "$f" | tr ':' '_')
              cp -v "$f" "repos/x86_64/$base"
            done
            # Append version entry
            [ -f "$d/versions.txt" ] && cat "$d/versions.txt" >> build-versions.txt
          done

          echo "Build versions:"
          cat build-versions.txt || true

      - name: Download packages from previous Release (for skipped -git packages)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download the previous release's packages to reuse those that
          # were skipped this round (-git with unchanged commit).
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.pkg.tar.zst' \
            --dir ./prev-pkgs || true
          # Copy packages that don't already exist in our new build
          for f in ./prev-pkgs/*.pkg.tar.*; do
            [ -f "$f" ] || continue
            base=$(basename "$f" | tr ':' '_')
            if [ ! -f "repos/x86_64/$base" ]; then
              cp -v "$f" "repos/x86_64/$base"
              echo "Reused from previous release: $base"
            fi
          done
          # Copy previous versions file entries for skipped packages
          gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "last-versions.txt" \
            --dir ./prev-release --clobber || true
          if [ -f ./prev-release/last-versions.txt ]; then
            cat ./prev-release/last-versions.txt >> retained-versions.txt
          fi

      - name: Create repository database
        run: |
          cd repos/x86_64

          PKG_COUNT=$(ls -1 *.pkg.tar.* 2>/dev/null | wc -l || true)
          echo "Packages in repo: $PKG_COUNT"
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "No packages — aborting"
            exit 1
          fi

          rm -f arch_lib.db.tar.gz arch_lib.db arch_lib.files.tar.gz arch_lib.files

          if [ -n "$KEY_ID" ]; then
            # Sign the database (GPGKEY env var used by repo-add)
            echo "Signing repository database with $KEY_ID"
            GPGKEY="$KEY_ID" repo-add --remove --new --sign arch_lib.db.tar.gz ./*.pkg.tar.*
          else
            repo-add --remove --new arch_lib.db.tar.gz ./*.pkg.tar.*
          fi

          # Create real copies (not symlinks) — GitHub Release assets are
          # flat, and pacman requests both <repo>.db and <repo>.db.tar.gz
          rm -f arch_lib.db arch_lib.files
          cp arch_lib.db.tar.gz arch_lib.db
          cp arch_lib.files.tar.gz arch_lib.files

          # Copy detached signatures for the .db copies too
          if [ -n "$KEY_ID" ]; then
            cp arch_lib.db.tar.gz.sig arch_lib.db.sig 2>/dev/null || true
            cp arch_lib.files.tar.gz.sig arch_lib.files.sig 2>/dev/null || true
          fi
          ls -lh

      - name: Sign packages
        if: env.KEY_ID != ''
        run: |
          cd repos/x86_64
          for f in *.pkg.tar.*; do
            [ -f "$f" ] || continue
            echo "Signing: $f"
            gpg --batch --yes --detach-sign --local-user "$KEY_ID" "$f"
          done
          echo "All packages signed"

      - name: Update last-versions.txt
        run: |
          # Start with previous versions
          cp last-versions.txt new-versions.txt 2>/dev/null || : > new-versions.txt

          # Overlay this run's versions
          if [ -f build-versions.txt ]; then
            while IFS='=' read -r pkg ver; do
              [ -n "$pkg" ] || continue
              if grep -q "^${pkg}=" new-versions.txt 2>/dev/null; then
                sed -i "s/^${pkg}=.*/${pkg}=${ver}/" new-versions.txt
              else
                echo "${pkg}=${ver}" >> new-versions.txt
              fi
            done < build-versions.txt
          fi

          # Retain versions for skipped packages from previous release
          if [ -f retained-versions.txt ]; then
            while IFS='=' read -r pkg ver; do
              [ -n "$pkg" ] || continue
              if ! grep -q "^${pkg}=" new-versions.txt 2>/dev/null; then
                echo "${pkg}=${ver}" >> new-versions.txt
              fi
            done < retained-versions.txt
          fi

          mv new-versions.txt last-versions.txt
          echo "Final versions:"
          cat last-versions.txt

      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Compute release name
        id: release-name
        run: |
          echo "value=Arch Lib Repository $(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create new Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.release-name.outputs.value }}
          body: |
            ## arch_lib pacman repository

            Daily build of AUR packages.

            **Usage** — add to `/etc/pacman.conf`:
            ```ini
            [arch_lib]
            SigLevel = Optional TrustAll
            Server = ${{ github.server_url }}/${{ github.repository }}/releases/download/latest
            ```

            Then: `sudo pacman -Sy && sudo pacman -S <package>`

            **Signing**: 若仓库已配置 GPG_PRIVATE_KEY，包和数据库均带 `.sig` 签名。
            导入公钥后可改用 `SigLevel = Required DatabaseOptional` 验证。
          files: |
            last-versions.txt
            arch_lib.pub.asc
            repos/x86_64/*.pkg.tar.zst
            repos/x86_64/*.pkg.tar.zst.sig
            repos/x86_64/arch_lib.db.tar.gz
            repos/x86_64/arch_lib.db.tar.gz.sig
            repos/x86_64/arch_lib.db
            repos/x86_64/arch_lib.db.sig
            repos/x86_64/arch_lib.files.tar.gz
            repos/x86_64/arch_lib.files.tar.gz.sig
            repos/x86_64/arch_lib.files
            repos/x86_64/arch_lib.files.sig
          prerelease: false
          make_latest: true