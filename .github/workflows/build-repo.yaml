# =============================================================================
# Build AUR Repository — daily cron + manual trigger (orchestrator)
#
# 编排器：调度（schedule/push/manual）→ prepare → build（matrix）→
# publish（调 publish-repo.yaml）→ deploy-s3（调 deploy-s3.yaml，可选）
#
# 子工作流（各自可独立复用/手动触发）：
#   .github/workflows/build-package.yaml   # 单包构建（matrix 调用）
#   .github/workflows/publish-repo.yaml    # 收集 artifacts + repo-add + 上传 latest
#   .github/workflows/deploy-s3.yaml       # latest → S3 同步
#   .github/workflows/manual-publish.yaml  # 手动重发布（从历史构建 run）
#   .github/workflows/manual-deploy-s3.yaml# 手动 S3 同步
# =============================================================================

name: Build AUR Repository

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  # ── Prepare: parse package list ────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix from packages.txt
        id: gen-matrix
        run: |
          packages=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' packages.txt | grep -v '^$' | jq -R . | jq -s -c .)
          echo "matrix=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  # ── Build: one job per package (reusable workflow) ─────────────────
  build:
    needs: prepare
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    uses: ./.github/workflows/build-package.yaml
    with:
      package: ${{ matrix.pkg }}

  # ── Publish: collect packages, build repo db, upload latest ────────
  publish:
    needs: [prepare, build]
    # 单个 build 失败不应阻塞整个仓库发布：prepare 成功后即发布已成功的包。
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/publish-repo.yaml
    secrets: inherit

  # ── Deploy to S3（可选，配置 S3_* secrets 后自动启用）──────────────
  # secrets 不能用于 job if（GitHub 限制），S3 配置检查在 deploy-s3.yaml
  # 内部 guard step 完成（未配置则跳过所有步骤）。
  deploy-s3:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-s3.yaml
    secrets: inherit
