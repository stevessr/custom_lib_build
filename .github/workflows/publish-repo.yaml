# =============================================================================
# Publish Repository (reusable) — 收集包 artifacts，生成 pacman 仓库数据库，
# 上传到 `latest` Release
#
# 由 build-repo.yaml 调用（默认从当前 workflow run 下载 package-* artifacts）；
# 也可由 manual-publish.yaml 调用并传入 build-run-id，从指定的历史构建
# run 下载 artifacts 重新发布（如上次发布失败时重试）。
#
# secrets 由调用方 `secrets: inherit` 传入（on.workflow_call 无需声明，
# 官方语法只支持命名 secrets 列表）：
#   GITHUB_TOKEN（自动）  GPG_PRIVATE_KEY（可选，签名）
# =============================================================================

name: Publish Repository (reusable)

on:
  workflow_call:
    inputs:
      # 指定从中下载 artifacts 的构建 run ID；留空则用当前 workflow run
      build-run-id:
        type: string
        required: false
      partial-update:
        type: boolean
        required: false
        default: false
      # Explicit opt-out only for deliberately partial manual recovery.
      # Ordinary scheduled/push builds must never bypass Claude artifact gate.
      allow-missing-required-claude:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: read

jobs:
  publish:
    # Both scheduled/manual repo publication and index repair write the same
    # latest Release assets. They must not run concurrently. Queue, never
    # cancel an active writer mid-upload (a Release update is not atomic).
    concurrency:
      group: ${{ github.repository }}-release-asset-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    container:
      # 每日预构建镜像（build-arch-builder-image.yaml 维护），已含
      # gnupg / pacman-contrib / jq；credentials 允许拉取私有 GHCR 包
      image: ghcr.io/${{ github.repository }}/arch-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Incremental system upgrade
        run: |
          # arch-builder 镜像每日维护，只做增量升级（命中镜像层缓存）
          pacman -Syu --noconfirm

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/gpg-key.asc
            gpg --batch --import /tmp/gpg-key.asc
            rm -f /tmp/gpg-key.asc
            FPR=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            echo "KEY_ID=$FPR" >> "$GITHUB_ENV"
            echo "Signing key imported: $FPR"
          else
            echo "No GPG_PRIVATE_KEY secret — repo unsigned"
          fi

      # ── Download artifacts: 当前 run（默认）或指定 run（manual-publish）
      - name: Download package build artifacts
        if: ${{ inputs.build-run-id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: package-artifacts
          merge-multiple: false

      - name: Download package build artifacts (from build run ${{ inputs.build-run-id }})
        if: ${{ inputs.build-run-id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: package-artifacts
          merge-multiple: false
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preserved Claude assets (partial update)
        if: ${{ inputs.allow-missing-required-claude }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_PACKAGE_SIGNATURES: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          release_json=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/latest")
          assets_url=$(jq -r '.assets_url // empty' <<<"$release_json")
          [ -n "$assets_url" ] || { echo "::error::Cannot inspect existing release assets"; exit 1; }
          asset_names=$(mktemp)
          trap 'rm -f "$asset_names"' EXIT
          page=1
          while :; do
            chunk=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" "$assets_url?per_page=100&page=$page")
            [ "$(jq 'length' <<<"$chunk")" -gt 0 ] || break
            jq -r '.[].name' <<<"$chunk" >> "$asset_names"
            page=$((page + 1))
          done
          for required in claude-desktop-http-patch claude-desktop-full-patch; do
            manifest=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              "$download/manifest-$required.txt")
            [ -n "$manifest" ] || { echo "::error::Missing preserved manifest for $required"; exit 1; }
            found=0
            while IFS= read -r filename; do
              [[ "$filename" == *.pkg.tar.zst ]] || continue
              found=1
              grep -Fxq -- "$filename" "$asset_names" || {
                echo "::error::Cannot bypass Claude gate: missing existing package $filename"; exit 1;
              }
              if [ "$REQUIRE_PACKAGE_SIGNATURES" = "true" ]; then
                grep -Fxq -- "$filename.sig" "$asset_names" || {
                  echo "::error::Cannot bypass Claude gate: missing existing signature $filename.sig"; exit 1;
                }
              fi
            done <<< "$manifest"
            [ "$found" -eq 1 ] || { echo "::error::Empty preserved manifest for $required"; exit 1; }
          done
          echo "Verified existing Claude package assets and required signatures before partial update"

      - name: Collect package artifacts
        run: |
          mkdir -p repos/x86_64 release-metadata
          shopt -s nullglob
          package_count=0

          for artifact_dir in package-artifacts/package-*; do
            [ -d "$artifact_dir" ] || continue
            for package_file in "$artifact_dir"/*.pkg.tar.zst; do
              cp -f "$package_file" repos/x86_64/
              if [ -f "$package_file.sig" ]; then
                cp -f "$package_file.sig" repos/x86_64/
              fi
              package_count=$((package_count + 1))
            done
            for metadata_file in \
              "$artifact_dir"/version-*.txt \
              "$artifact_dir"/manifest-*.txt; do
              [ -f "$metadata_file" ] || continue
              cp -f "$metadata_file" release-metadata/
            done
          done

          if [ "$package_count" -eq 0 ]; then
            echo "No package artifacts downloaded"
            exit 1
          fi

          # Never allow a full repository publish to suppress its required
          # Claude artifact gate. Only explicitly approved partial updates
          # (e.g. Magpie) may inherit the existing Claude packages.
          if [ "${{ inputs.allow-missing-required-claude }}" = "true" ] && [ "${{ inputs.partial-update }}" != "true" ]; then
            echo "::error::Claude bypass is only permitted for partial publication"
            exit 1
          fi

          # Claude patch packages are release-critical. If a newer Desktop
          # build or patch fails, do not publish the other artifacts while
          # silently leaving an old Claude package looking current in latest.
          if [ "${{ inputs.allow-missing-required-claude }}" != "true" ]; then
            for required in claude-desktop-http-patch claude-desktop-full-patch; do
              if ! grep -Eq "^[[:space:]]*$required([[:space:]]|$)" packages.txt; then
                continue
              fi
              shopt -s nullglob
              files=("package-artifacts/package-$required"/*.pkg.tar.zst)
              shopt -u nullglob
              if [ "${#files[@]}" -eq 0 ]; then
                echo "Missing required Claude patch artifact: $required"
                exit 1
              fi
            done
          fi

          echo "--- Collected packages ---"
          ls -lh repos/x86_64/
          echo "--- Collected metadata ---"
          ls -lh release-metadata/

      # Partial publication must start from the existing complete database.
      # Fail without it rather than replacing hundreds of package entries.
      - name: Restore existing repository databases (partial update)
        if: ${{ inputs.partial-update }}
        run: |
          set -euo pipefail
          cd repos/x86_64
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          for db in arch_lib.db.tar.gz arch_lib.files.tar.gz; do
            curl -fsSL --max-time 120 --retry 5 --retry-all-errors --retry-delay 2 \
              "$base_url/$db" -o "$db"
            bsdtar -tf "$db" >/dev/null
          done
          count=$(bsdtar -tf arch_lib.db.tar.gz | grep -c '/desc$' || true)
          if [ "$count" -lt 3 ]; then
            echo "::error::Existing repository db missing or too small for partial update"
            exit 1
          fi
          printf '%s\n' "$count" > "$GITHUB_WORKSPACE/.previous_repo_count"

          # Keep each untouched package's in-database detached signature field.
          # repo-add may replace entries for selected package files, but every
          # other filename and signature must survive the database rewrite.
          snapshot_repo_signatures() {
            local db_file="$1" output_file="$2" temp_dir
            temp_dir=$(mktemp -d)
            if ! bsdtar -xf "$db_file" -C "$temp_dir"; then
              rm -rf "$temp_dir"
              return 1
            fi
            : > "$output_file"
            while IFS= read -r -d '' desc_file; do
              awk '
                /^%NAME%$/ { getline; package_name=$0 }
                /^%FILENAME%$/ { getline; filename=$0 }
                /^%PGPSIG%$/ { getline; signature=$0 }
                END { if (package_name != "") printf "%s\t%s\t%s\n", package_name, filename, signature }
              ' "$desc_file" >> "$output_file"
            done < <(find "$temp_dir" -type f -name desc -print0)
            rm -rf "$temp_dir"
            sort -o "$output_file" "$output_file"
          }
          snapshot_repo_signatures arch_lib.db.tar.gz \
            "$GITHUB_WORKSPACE/.previous_repo_signatures.tsv"
          echo "Partial update preserving $count database entries and their signature fields"

      # ── Validate archives before indexing or upload ─────────────────
      - name: Validate package archives
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(repos/x86_64/*.pkg.tar.zst)
          (( ${#packages[@]} > 0 )) || { echo "::error::No package archives"; exit 1; }
          for file in "${packages[@]}"; do
            # Qip checks metadata, but zstd -t checks the entire compressed stream.
            if ! zstd -tq "$file"; then
              echo "::error file=$file::Corrupt/truncated zstd package"
              exit 1
            fi
            if ! info=$(pacman -Qip "$file"); then
              echo "::error file=$file::Invalid pacman package"
              exit 1
            fi
            printf '%s\n' "$info" | grep -Eq '^Name[[:space:]]*:' || exit 1
            printf '%s\n' "$info" | grep -Eq '^Version[[:space:]]*:' || exit 1
          done
          echo "Validated ${#packages[@]} complete pacman archives"

      # ── Sanitize epoch colons & sign ───────────────────────────────
      - name: Sanitize and sign packages
        run: |
          cd repos/x86_64

          # Epoch colons (e.g. kiro-ide-2:1.0.242) break GitHub uploads
          for f in *:*.pkg.tar.zst; do
            [ -f "$f" ] || continue
            dest=$(basename "$f" | tr ':' '_')
            mv -v "$f" "$dest"
          done

          # Sign each package if key configured
          if [ -n "${KEY_ID:-}" ]; then
            for f in *.pkg.tar.zst; do
              [ -f "$f" ] || continue
              # Reused artifacts carry the exact release signature. Only sign
              # newly built packages which do not already have that sidecar.
              [ -f "$f.sig" ] && { echo "Keeping staged signature: $f.sig"; continue; }
              echo "Signing: $f"
              gpg --batch --yes --detach-sign --local-user "$KEY_ID" "$f"
            done
          fi

      # ── Create repository database ─────────────────────────────────
      - name: Create repository database
        run: |
          cd repos/x86_64

          PKG_COUNT=$(ls -1 *.pkg.tar.zst 2>/dev/null | wc -l || true)
          echo "Packages in repo: $PKG_COUNT"
          if [ "$PKG_COUNT" -eq 0 ]; then
            echo "No packages — aborting"
            exit 1
          fi

          # Full publishes start clean; partial publishes edit the restored db.
          if [ "${{ inputs.partial-update }}" != "true" ]; then
            rm -f arch_lib.db.tar.gz arch_lib.files.tar.gz
          fi
          rm -f arch_lib.db arch_lib.files arch_lib.db.sig arch_lib.files.sig

          # Only pass .zst files to repo-add: the *.pkg.tar.* glob would also
          # match the .sig files generated above, and repo-add would try to
          # parse each signature as a package (bsdtar: Unrecognized archive
          # format). repo-add picks up sibling .sig files automatically.
          if [ -n "${KEY_ID:-}" ]; then
            echo "Signing repository database with $KEY_ID"
            GPGKEY="$KEY_ID" repo-add --sign arch_lib.db.tar.gz ./*.pkg.tar.zst
          else
            repo-add arch_lib.db.tar.gz ./*.pkg.tar.zst
          fi

          if [ "${{ inputs.partial-update }}" = "true" ]; then
            before=$(cat "$GITHUB_WORKSPACE/.previous_repo_count")
            after=$(bsdtar -tf arch_lib.db.tar.gz | grep -c '/desc$' || true)
            if [ "$after" -lt "$before" ]; then
              echo "::error::Partial update dropped repository entries: before=$before after=$after"
              exit 1
            fi
            echo "Partial update kept $before existing entries; new count $after"

            # Compare untouched package names, filenames, and embedded signatures;
            # old versions of selected packages are allowed to disappear.
            # Each GitHub Actions run: block is a separate shell, so define the
            # database snapshot helper in this step as well.
            snapshot_repo_signatures() {
              local db_file="$1" output_file="$2" temp_dir
              temp_dir=$(mktemp -d)
              if ! bsdtar -xf "$db_file" -C "$temp_dir"; then
                rm -rf "$temp_dir"
                return 1
              fi
              : > "$output_file"
              while IFS= read -r -d "" desc_file; do
                awk '
                  /^%NAME%$/ { getline; package_name=$0 }
                  /^%FILENAME%$/ { getline; filename=$0 }
                  /^%PGPSIG%$/ { getline; signature=$0 }
                  END { if (package_name != "") printf "%s\t%s\t%s\n", package_name, filename, signature }
                ' "$desc_file" >> "$output_file"
              done < <(find "$temp_dir" -type f -name desc -print0)
              rm -rf "$temp_dir"
              sort -o "$output_file" "$output_file"
            }
            snapshot_repo_signatures arch_lib.db.tar.gz \
              "$GITHUB_WORKSPACE/.current_repo_signatures.tsv"
            : > "$GITHUB_WORKSPACE/.updated_package_names"
            for package_file in ./*.pkg.tar.zst; do
              [ -f "$package_file" ] || continue
              pacman -Qip "$package_file" | awk -F': *' '$1 ~ /^Name[[:space:]]*$/ { print $2; exit }' \
                >> "$GITHUB_WORKSPACE/.updated_package_names"
            done
            sort -u -o "$GITHUB_WORKSPACE/.updated_package_names" "$GITHUB_WORKSPACE/.updated_package_names"
            awk -F '\t' '
              FILENAME == ARGV[1] { updated[$1]=1; next }
              FILENAME == ARGV[2] { if (!($1 in updated)) old[$1]=$2 "\t" $3; next }
              FILENAME == ARGV[3] { if (!($1 in updated)) current[$1]=$2 "\t" $3; next }
              END {
                failed=0
                for (name in old) {
                  if (!(name in current)) {
                    printf "::error::Partial update dropped untouched package %s\n", name
                    failed=1
                  } else if (old[name] != current[name]) {
                    printf "::error::Partial update changed filename or package signature for untouched package %s\n", name
                    failed=1
                  }
                }
                if (!failed) print "Verified all untouched package filenames and signature fields are unchanged"
                exit failed
              }
            ' "$GITHUB_WORKSPACE/.updated_package_names" \
              "$GITHUB_WORKSPACE/.previous_repo_signatures.tsv" \
              "$GITHUB_WORKSPACE/.current_repo_signatures.tsv"
          fi

          # Real copies (not symlinks) — GitHub Release assets are flat,
          # pacman requests both <repo>.db and <repo>.db.tar.gz
          rm -f arch_lib.db arch_lib.files
          cp arch_lib.db.tar.gz arch_lib.db
          cp arch_lib.files.tar.gz arch_lib.files

          if [ -n "${KEY_ID:-}" ]; then
            cp arch_lib.db.tar.gz.sig arch_lib.db.sig 2>/dev/null || true
            cp arch_lib.files.tar.gz.sig arch_lib.files.sig 2>/dev/null || true
          fi
          ls -lh

      # ── Incremental upload to `latest` Release ────────────────────
      # publish-release.sh: 对比 version 元数据，只上传变化的包文件、
      # 删除旧版本资产、最后重建 db；全 skip 时完全不触碰 release。
      # 不再删除 release/tag（无 404 窗口期），同名资产先删再传（幂等）。
      - name: Update latest release (incremental)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-release.sh \
            "$GITHUB_WORKSPACE/repos/x86_64" \
            "$GITHUB_WORKSPACE/release-metadata" \
            "$GITHUB_WORKSPACE/arch_lib.pub.asc" \
            "$GH_TOKEN"
