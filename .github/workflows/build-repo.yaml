# =============================================================================
# Build AUR Repository — daily cron + manual trigger (orchestrator)
#
# 编排器：调度（schedule/push/manual）→ prepare → build（matrix）→
# publish（调 publish-repo.yaml）→ deploy-s3（调 deploy-s3.yaml，可选）
#
# 子工作流（各自可独立复用/手动触发）：
#   .github/workflows/build-package.yaml   # 单包构建（matrix 调用）
#   .github/workflows/publish-repo.yaml    # 收集 artifacts + repo-add + 上传 latest
#   .github/workflows/deploy-s3.yaml       # latest → S3 同步
#   .github/workflows/manual-publish.yaml  # 手动重发布（从历史构建 run）
#   .github/workflows/manual-deploy-s3.yaml# 手动 S3 同步
# =============================================================================

name: Build AUR Repository

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: read

jobs:
  # ── Prepare: parse package list + split 包去重 ────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix from packages.txt
        id: gen-matrix
        run: |
          mapfile -t pkgs < <(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' packages.txt | grep -v '^$')

          # 解析 AUR PackageBase：split 包（rustrover / rustrover-jre）共享
          # 同一 PKGBUILD，一次 makepkg 产出全部子包。矩阵只保留每个 base
          # 在 packages.txt 中的第一个包名，同族版本/资产元数据由构建
          # （或复用）job 一并产出，避免重复下载 ~1GB 源码 + 重复构建。
          declare -A base_of=()
          : > /tmp/aur-bases.txt
          for ((i=0; i<${#pkgs[@]}; i+=40)); do
            args=()
            for pkg in "${pkgs[@]:i:40}"; do
              args+=(--data-urlencode "arg[]=$pkg")
            done
            curl -G -fsSL --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
              "${args[@]}" "https://aur.archlinux.org/rpc/v5/info" 2>/dev/null \
              | jq -r '.results[]? | "\(.Name)\t\(.PackageBase)"' 2>/dev/null || true
          done >> /tmp/aur-bases.txt
          while IFS=$'\t' read -r name base; do
            [ -n "$name" ] && base_of["$name"]="$base"
          done < /tmp/aur-bases.txt

          declare -A seen_base=()
          kept=()
          for pkg in "${pkgs[@]}"; do
            # custom 包总是重建，不参与去重
            if [ -f "custom-pkgs/$pkg/PKGBUILD" ]; then
              kept+=("$pkg")
              continue
            fi
            base="${base_of[$pkg]:-}"
            if [ -n "$base" ] && [ -n "${seen_base[$base]:-}" ]; then
              echo "  dedup: $pkg (same PackageBase $base — covered by sibling)"
              continue
            fi
            [ -n "$base" ] && seen_base["$base"]=1
            kept+=("$pkg")
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${kept[@]}" | jq -R . | jq -s -c . > /tmp/matrix.json
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "Packages: ${#kept[@]} (dedup'd from ${#pkgs[@]})"

  # ── Build: one job per package (reusable workflow) ─────────────────
  build:
    needs: prepare
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    uses: ./.github/workflows/build-package.yaml
    with:
      package: ${{ matrix.pkg }}

  # ── Publish: collect packages, build repo db, upload latest ────────
  publish:
    needs: [prepare, build]
    # 单个 build 失败不应阻塞整个仓库发布：prepare 成功后即发布已成功的包。
    # always() 必须显式保留对失败 needs 的执行资格；fail-fast=false 让其余矩阵项继续。
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/publish-repo.yaml
    secrets: inherit

  # ── Deploy to S3（可选，配置 S3_* secrets 后自动启用）──────────────
  # secrets 不能用于 job if（GitHub 限制），S3 配置检查在 deploy-s3.yaml
  # 内部 guard step 完成（未配置则跳过所有步骤）。
  deploy-s3:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/deploy-s3.yaml
    secrets: inherit
