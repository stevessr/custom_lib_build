# =============================================================================
# Build AUR Repository — daily cron + manual trigger
#
# Strategy:
#   1. prepare  — read packages.txt, generate matrix
#   2. build    — matrix: one job per package; each job builds its package
#                 and uploads it DIRECTLY to its own GitHub Release
#                 (tag = package name, overwritten on every run)
#
# Each package release contains:
#   <pkg>.pkg.tar.zst        — built package
#   <pkg>.pkg.tar.zst.sig    — GPG signature (if signing key configured)
#   version.txt              — last built version (used for -git skip check)
#
# -git packages: build-package.sh compares the upstream commit hash
# (git ls-remote) against version.txt from the previous release; if
# unchanged, the build is skipped and the old release is left in place.
# =============================================================================

name: Build AUR Repository

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Prepare: parse package list ────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate matrix from packages.txt
        id: gen-matrix
        run: |
          packages=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' packages.txt | grep -v '^$' | jq -R . | jq -s -c .)
          echo "matrix=${packages}" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  # ── Build: one job per package, direct release upload ──────────────
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Arch system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git libglvnd pacman-contrib sudo

      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.cache/aur-sources /tmp/aur-build
          chown -R builder:builder /home/builder /tmp/aur-build

      # ── Version tracking: fetch previous version from own release ──
      - name: Fetch previous version from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ matrix.pkg }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "version.txt" \
            --dir . --clobber 2>/dev/null || true
          if [ -f version.txt ]; then
            ver=$(cat version.txt)
            echo "${{ matrix.pkg }}=${ver}" > last-versions.txt
            echo "Previous version: $ver"
          else
            touch last-versions.txt
            echo "No previous version — will build"
          fi

      - name: Cache AUR sources
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/aur-sources
          key: aur-sources-${{ matrix.pkg }}-${{ github.run_id }}
          restore-keys: |
            aur-sources-${{ matrix.pkg }}-

      # ── Build (skips -git packages with unchanged commit) ──────────
      - name: Build package ${{ matrix.pkg }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # -E: keep env (SRCDEST, GITHUB_WORKSPACE), -H: set HOME=/home/builder
          sudo -EHu builder bash scripts/build-package.sh "${{ matrix.pkg }}"

      # ── Read build result ──────────────────────────────────────────
      - name: Check build result
        id: result
        run: |
          outfile="$GITHUB_WORKSPACE/output-${{ matrix.pkg }}.env"
          if [ -f "$outfile" ]; then
            source "$outfile"
            echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
            echo "skipped=${skipped:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Sign package (if signing key configured) ───────────────────
      - name: Sign package
        if: steps.result.outputs.skipped != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/gpg-key.asc
            gpg --batch --import /tmp/gpg-key.asc
            rm -f /tmp/gpg-key.asc
            for f in repos/x86_64/*.pkg.tar.*; do
              [ -f "$f" ] || continue
              echo "Signing: $f"
              gpg --batch --yes --detach-sign "$f"
            done
          else
            echo "No GPG_PRIVATE_KEY secret — package unsigned"
          fi

      # ── Upload directly to this package's release ──────────────────
      - name: Publish to release ${{ matrix.pkg }}
        if: steps.result.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # Write version.txt asset for next run's -git skip check
          echo "${{ steps.result.outputs.version }}" > version.txt
          cp version.txt repos/x86_64/ 2>/dev/null || true

          echo "Packages to upload:"
          ls -lh repos/x86_64/

          # Delete previous release (overwrite semantics)
          gh release delete "${{ matrix.pkg }}" \
            --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          # Build the file list dynamically (globs that match nothing
          # would be passed as literal args and error out)
          FILES=()
          for f in repos/x86_64/*.pkg.tar.* repos/x86_64/*.sig repos/x86_64/version.txt; do
            [ -f "$f" ] && FILES+=("$f")
          done

          # Create new release with all artifacts
          # (|| true: if delete+cleanup-tag failed, tag may still exist)
          gh release create "${{ matrix.pkg }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ matrix.pkg }} ${{ steps.result.outputs.version }}" \
            --notes "Auto-built from AUR on $(date -u +%Y-%m-%d)" \
            "${FILES[@]}" || true