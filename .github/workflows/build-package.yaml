# =============================================================================
# Reusable: build a single AUR package and upload a workflow artifact
#
# Called by:
#   - build-repo.yaml   (matrix, daily cron)
#   - manual-build.yaml (workflow_dispatch)
#
# 流程（版本判断前置，避免无谓的重流程）：
#   1. check-version  — 轻量 ubuntu job（无容器）：custom/-git/普通包版本
#                       判断。普通包：version 文件一致即复用；不一致时
#                       HEAD 探测 latest 资产（publish 中断留下的中间态
#                       可自愈，无需重建）；-git 对比 commit hash。
#   2. build          — 仅当需要重建时运行（arch-builder 容器 + pacman 增量
#                       升级 + makepkg 构建；split 包一次产出全部子包）
#   3. reuse          — 仅当版本未变化时运行：无容器，以 release 资产清单
#                       为准下载旧包文件（不信任可能过期的 manifest），并
#                       用 check-version 的当前版本重写 version 元数据
#                       （split 同族一并刷新）→ 中间态自愈
#
# build-repo.yaml 的矩阵已按 AUR PackageBase 去重：split 包（rustrover /
# rustrover-jre）只保留一个条目，避免重复下载/构建。
#
# 任一版本判断失败（网络抖动等）都保守地走构建路径：包永远不会因为
# 判断错误而从仓库消失。
#
# The build job does not publish a per-package Release. It uploads package
# files plus version/manifest metadata as an Actions artifact; the publish
# job combines every artifact into the `latest` pacman repository Release.
# =============================================================================

name: Build Package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  # ── 版本预判：重流程（容器/升级/构建）之前完成 ────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      version: ${{ steps.check.outputs.version }}
      pkgname: ${{ steps.check.outputs.pkgname }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version before heavy build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/check-version.sh "${{ inputs.package }}" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/check-${{ inputs.package }}.env"
          # shellcheck source=/dev/null
          source "$GITHUB_WORKSPACE/check-${{ inputs.package }}.env"
          echo "needs_build=${needs_build}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pkgname=${pkgname:-}" >> "$GITHUB_OUTPUT"
          echo "Decision for ${{ inputs.package }}: needs_build=$needs_build version=$version pkgname=${pkgname:-}"

  build:
    needs: check-version
    # check-version 失败（failure()）时也照常构建——保守，不丢包
    if: ${{ !cancelled() && (failure() || needs.check-version.outputs.needs_build == 'true') }}
    runs-on: ubuntu-latest
    container:
      # 每日预构建镜像（build-arch-builder-image.yaml 维护），已含
      # base-devel + 全部依赖；credentials 允许拉取私有 GHCR 包
      image: ghcr.io/${{ github.repository }}/arch-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      # 镜像层已保留 /var/cache/pacman/pkg 缓存；再叠一层 GitHub cache
      # 覆盖镜像重建之间的增量下载（-Syu 下载的包保存，下次 run 复用）。
      - name: Cache pacman package downloads
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-pkg-v1
          restore-keys: pacman-pkg-v1

      - name: Incremental system upgrade
        run: |
          # arch-builder 镜像每日维护，这里只做增量升级：
          # 未变化的包命中缓存/镜像层，零或少量下载
          pacman -Syu --noconfirm

      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: SETENV: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.cache/aur-sources /tmp/aur-build
          chown -R builder:builder /home/builder /tmp/aur-build

      # ── Version tracking: fetch metadata from `latest` ─────────────
      - name: Fetch previous metadata from latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="${{ inputs.package }}"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          version_file="$GITHUB_WORKSPACE/version-${package}.txt"
          manifest_file="$GITHUB_WORKSPACE/manifest-${package}.txt"
          rm -f "$version_file" "$manifest_file" "$GITHUB_WORKSPACE/last-versions.txt"

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$base_url/$(basename "$version_file")" -o "$version_file" 2>/dev/null || true
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$base_url/$(basename "$manifest_file")" -o "$manifest_file" 2>/dev/null || true

          if [ -s "$version_file" ] && [ -s "$manifest_file" ]; then
            ver=$(cat "$version_file")
            echo "${package}=${ver}" > "$GITHUB_WORKSPACE/last-versions.txt"
            echo "Previous version: $ver"
          else
            rm -f "$version_file" "$manifest_file"
            : > "$GITHUB_WORKSPACE/last-versions.txt"
            echo "No complete metadata in latest — will build"
          fi

      - name: Cache AUR sources
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/aur-sources
          key: aur-sources-${{ inputs.package }}-${{ github.run_id }}
          restore-keys: |
            aur-sources-${{ inputs.package }}-

      # ── Build (skips -git packages with unchanged commit) ──────────
      - name: Build package ${{ inputs.package }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          # Container jobs must use the container-side path from
          # $GITHUB_WORKSPACE, not the host-side github.workspace expression.
          export REPO_DIR="$GITHUB_WORKSPACE/repos/x86_64"
          export LAST_VERSIONS_FILE="$GITHUB_WORKSPACE/last-versions.txt"
          # -E: keep env (including the paths above), -H: HOME=/home/builder
          sudo -EHu builder bash scripts/build-package.sh "${{ inputs.package }}"

      # ── Read build result ──────────────────────────────────────────
      - name: Check build result
        id: result
        run: |
          outfile="$GITHUB_WORKSPACE/output-${{ inputs.package }}.env"
          if [ -f "$outfile" ]; then
            source "$outfile"
            echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
            echo "skipped=${skipped:-false}" >> "$GITHUB_OUTPUT"
          else
            echo "version=unknown" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Reuse skipped package files from latest ────────────────────
      # 与 reuse job 相同：以 release 资产清单为准（latest 上的 manifest
      # 可能因 publish 中断而指向已删除的旧资产）。
      - name: Reuse skipped package from latest
        if: steps.result.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="${{ inputs.package }}"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          manifest="$GITHUB_WORKSPACE/manifest-${package}.txt"
          repo_dir="$GITHUB_WORKSPACE/repos/x86_64"

          # GitHub's API does not expose assets at /releases/tags/<tag>/assets.
          # Resolve the release first, then use its documented assets_url.
          release_json=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/tags/latest")
          assets_url=$(jq -r '.assets_url // empty' <<<"$release_json")
          if [ -z "$assets_url" ]; then
            echo "Unable to resolve the latest release assets endpoint"
            exit 1
          fi

          asset_names=$(mktemp)
          trap 'rm -f "$asset_names"' EXIT
          page=1
          while :; do
            chunk=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$assets_url?per_page=100&page=$page")
            [ "$(jq 'length' <<<"$chunk")" -eq 0 ] && break
            jq -r '.[].name' <<<"$chunk" >> "$asset_names"
            page=$((page + 1))
          done

          candidates=$(awk -v p="$package-" 'index($0,p)==1' "$asset_names" \
            | grep '\.pkg\.tar\.zst$' | grep -v '\.sig$' | sort -V || true)
          if [ -z "$candidates" ]; then
            echo "No package assets for $package in latest"
            exit 1
          fi
          maxver=$(printf '%s\n' "$candidates" \
            | sed -E 's/-[^-]+-[^-]+\.pkg\.tar\.zst$//' \
            | awk -F- '{print $NF}' | sort -V | tail -1)
          esc=$(sed 's/[][\\/.^$*+?(){}|]/\\&/g' <<<"$maxver")
          files=$(printf '%s\n' "$candidates" \
            | grep -E -- "-${esc}-[^-]+-[^-]+\.pkg\.tar\.zst$" || true)
          [ -n "$files" ] || { echo "No files for version $maxver"; exit 1; }

          mkdir -p "$repo_dir"
          : > "$manifest"
          while IFS= read -r filename; do
            dest="$repo_dir/$filename"
            partial="${dest}.part"
            echo "  ↓ $filename (resumable)"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --continue-at - -H "Authorization: Bearer $GH_TOKEN" \
              -o "$partial" "$dl/$filename"
            mv -f "$partial" "$dest"
            printf '%s\n' "$filename" >> "$manifest"
          done <<< "$files"
          rm -f "$asset_names"

          if ! compgen -G "$repo_dir/*.pkg.tar.zst" >/dev/null; then
            echo "No package files restored for $package"
            exit 1
          fi

      # ── Stage package artifact for the publish job ─────────────────
      - name: Stage package artifact
        run: |
          package="${{ inputs.package }}"
          repo_dir="$GITHUB_WORKSPACE/repos/x86_64"
          artifact_dir="$GITHUB_WORKSPACE/package-artifact"
          version_file="$GITHUB_WORKSPACE/version-${package}.txt"
          manifest_file="$GITHUB_WORKSPACE/manifest-${package}.txt"

          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          mapfile -t package_files < <(
            find "$repo_dir" -maxdepth 1 -type f -name '*.pkg.tar.zst' -printf '%f\n' | sort
          )
          if [ "${#package_files[@]}" -eq 0 ]; then
            echo "No package files available for $package"
            exit 1
          fi

          printf '%s\n' "${package_files[@]}" > "$manifest_file"
          printf '%s\n' "${{ steps.result.outputs.version }}" > "$version_file"
          # split 包同族：为每个构建产物名写 version-<name>.txt
          # （rustrover 的 makepkg 同时产出 rustrover-jre；矩阵按
          # PackageBase 去重后，同族包靠这里刷新版本元数据）
          while IFS= read -r filename; do
            name=$(pacman -Qip "$repo_dir/$filename" 2>/dev/null \
              | grep '^Name' | awk '{print $3}') || continue
            [ -n "$name" ] || continue
            grep -qxF "$name" packages.txt || continue
            printf '%s\n' "${{ steps.result.outputs.version }}" \
              > "$GITHUB_WORKSPACE/version-${name}.txt"
          done < "$manifest_file"
          for filename in "${package_files[@]}"; do
            cp "$repo_dir/$filename" "$artifact_dir/"
          done
          cp "$manifest_file" "$artifact_dir/"
          for vf in "$GITHUB_WORKSPACE"/version-*.txt; do
            [ -f "$vf" ] && cp "$vf" "$artifact_dir/"
          done
          echo "Package artifact contents:"
          ls -lh "$artifact_dir"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.package }}
          path: package-artifact
          compression-level: 0
          if-no-files-found: error

  # ── 版本未变化：无容器轻量复用旧包（不启动 arch 容器）─────────────
  reuse:
    needs: check-version
    if: ${{ needs.check-version.result == 'success' && needs.check-version.outputs.needs_build == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 复用旧包（版本未变）───────────────────────────────────
      # 以 release 资产清单（API 分页）为准，而不是 latest 上的
      # manifest——后者可能因 publish 中断而过期（指向已删除的旧资产，
      # 按它下载会 404）。前缀 <pkg>- 匹配本包及 split 同族（rustrover-*
      # 同时命中 rustrover-jre-*）。版本文件用 check-version 计算的当前
      # 值重写，顺带把过期元数据自愈。
      - name: Reuse package files from latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="${{ inputs.package }}"
          version="${{ needs.check-version.outputs.version }}"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/latest"
          repo_dir="$GITHUB_WORKSPACE/repos/x86_64"
          manifest="$GITHUB_WORKSPACE/manifest-${package}.txt"
          mkdir -p "$repo_dir"

          # GitHub's API does not expose assets at /releases/tags/<tag>/assets.
          # Resolve the release first, then use its documented assets_url.
          release_json=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$api/releases/tags/latest")
          assets_url=$(jq -r '.assets_url // empty' <<<"$release_json")
          if [ -z "$assets_url" ]; then
            echo "Unable to resolve the latest release assets endpoint"
            exit 1
          fi

          asset_names=$(mktemp)
          trap 'rm -f "$asset_names"' EXIT
          page=1
          while :; do
            chunk=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$assets_url?per_page=100&page=$page")
            [ "$(jq 'length' <<<"$chunk")" -eq 0 ] && break
            jq -r '.[].name' <<<"$chunk" >> "$asset_names"
            page=$((page + 1))
          done

          candidates=$(awk -v p="$package-" 'index($0,p)==1' "$asset_names" \
            | grep '\.pkg\.tar\.zst$' | grep -v '\.sig$' | sort -V || true)
          if [ -z "$candidates" ]; then
            echo "No package assets for $package in latest"
            exit 1
          fi
          # 中断残留可能同时存在新旧两个版本的文件：只取最新版本
          maxver=$(printf '%s\n' "$candidates" \
            | sed -E 's/-[^-]+-[^-]+\.pkg\.tar\.zst$//' \
            | awk -F- '{print $NF}' | sort -V | tail -1)
          esc=$(sed 's/[][\\/.^$*+?(){}|]/\\&/g' <<<"$maxver")
          files=$(printf '%s\n' "$candidates" \
            | grep -E -- "-${esc}-[^-]+-[^-]+\.pkg\.tar\.zst$" || true)
          [ -n "$files" ] || { echo "No files for version $maxver"; exit 1; }

          : > "$manifest"
          while IFS= read -r filename; do
            dest="$repo_dir/$filename"
            partial="${dest}.part"
            echo "  ↓ $filename (resumable)"
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --continue-at - -H "Authorization: Bearer $GH_TOKEN" \
              -o "$partial" "$dl/$filename"
            mv -f "$partial" "$dest"
            printf '%s\n' "$filename" >> "$manifest"
          done <<< "$files"
          rm -f "$asset_names"

          if ! compgen -G "$repo_dir/*.pkg.tar.zst" >/dev/null; then
            echo "No package files restored for $package"
            exit 1
          fi

          # version 文件用 check-version 计算的当前版本（而非 latest 上
          # 可能过期的旧文件）；split 同族（pkgname 输出）一并刷新——
          # 它们共享同一 pkgver。
          printf '%s\n' "$version" > "$GITHUB_WORKSPACE/version-${package}.txt"
          IFS=',' read -ra siblings <<< "${{ needs.check-version.outputs.pkgname }}"
          for name in "${siblings[@]}"; do
            [ -n "$name" ] && [ "$name" != "$package" ] || continue
            grep -qxF "$name" packages.txt || continue
            printf '%s\n' "$version" > "$GITHUB_WORKSPACE/version-${name}.txt"
          done

      # ── Stage package artifact（与 build job 的产物结构一致）──────
      - name: Stage package artifact
        run: |
          package="${{ inputs.package }}"
          repo_dir="$GITHUB_WORKSPACE/repos/x86_64"
          artifact_dir="$GITHUB_WORKSPACE/package-artifact"
          version_file="$GITHUB_WORKSPACE/version-${package}.txt"
          manifest_file="$GITHUB_WORKSPACE/manifest-${package}.txt"

          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          mapfile -t package_files < <(
            find "$repo_dir" -maxdepth 1 -type f -name '*.pkg.tar.zst' -printf '%f\n' | sort
          )
          if [ "${#package_files[@]}" -eq 0 ]; then
            echo "No package files available for $package"
            exit 1
          fi

          printf '%s\n' "${package_files[@]}" > "$manifest_file"
          for filename in "${package_files[@]}"; do
            cp "$repo_dir/$filename" "$artifact_dir/"
          done
          cp "$manifest_file" "$artifact_dir/"
          # version 文件由上一个步骤写入（check-version 的当前版本 +
          # split 同族一并刷新），全部纳入 artifact
          for vf in "$GITHUB_WORKSPACE"/version-*.txt; do
            [ -f "$vf" ] && cp "$vf" "$artifact_dir/"
          done
          echo "Reused package artifact contents:"
          ls -lh "$artifact_dir"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.package }}
          path: package-artifact
          compression-level: 0
          if-no-files-found: error
